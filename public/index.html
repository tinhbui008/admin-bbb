<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- <title>Nihaoma — BBB Admin</title> -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    /* ===== TOKENS ===== */
    :root {
      --bg: #fbf4f5;
      --bg2: #fff7f8;
      --card: #ffffff;
      --card2: #fdf8f9;
      --text: #1b1417;
      --text2: #6f6266;
      --text3: #a99ea2;
      --border: #f0e4e6;
      --border2: #f7edef;
      --shadow: 0 1px 3px rgba(20,10,12,.06);
      --brand: #f1222d;
      --brand2: #c70d18;
      --brandSoft: #fdecec;
      --emerald: #0f9d6e;
      --emeraldSoft: #e6f7f0;
      --indigo: #4f46e5;
      --indigoSoft: #eef0fe;
      --amber: #d97706;
      --amberSoft: #fdf2e3;
      --slate: #475569;
      --slateSoft: #eef1f5;
    }

    [data-theme="dark"] {
      --bg: #100b0c;
      --bg2: #1a1113;
      --card: #1e1416;
      --card2: #241819;
      --text: #f5eff0;
      --text2: #a99ea2;
      --text3: #6f6266;
      --border: #2e1e21;
      --border2: #281c1e;
      --shadow: 0 1px 3px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 60px;
    }

    h1, h2, h3, p { margin: 0; }
    button, input, select { font: inherit; }

    @keyframes nh-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(15,157,110,.55); }
      70%  { box-shadow: 0 0 0 7px rgba(15,157,110,0); }
      100% { box-shadow: 0 0 0 0 rgba(15,157,110,0); }
    }
    @keyframes nh-rise {
      from { opacity:0; transform:translateY(7px); }
      to   { opacity:1; transform:none; }
    }

    ::-webkit-scrollbar { width:8px; height:8px; }
    ::-webkit-scrollbar-thumb { background:rgba(130,120,124,.3); border-radius:8px; }
    ::-webkit-scrollbar-track { background:transparent; }

    /* ===== HEADER ===== */
    .nh-header {
      position: sticky; top: 0; z-index: 40;
      background: rgba(255,247,248,.88);
      backdrop-filter: saturate(140%) blur(12px);
      -webkit-backdrop-filter: saturate(140%) blur(12px);
      border-bottom: 1px solid var(--border);
    }
    [data-theme="dark"] .nh-header { background: rgba(26,17,19,.88); }
    .nh-header-inner {
      max-width: 1440px; margin: 0 auto;
      padding: 13px 28px;
      display: flex; align-items: center; gap: 18px;
    }
    .nh-logo { display:flex; align-items:center; gap:11px; }
    .nh-logo-box {
      width:40px; height:40px; border-radius:12px; flex-shrink:0;
      background: linear-gradient(150deg, var(--brand), var(--brand2));
      display:grid; place-items:center;
      box-shadow: 0 4px 14px -3px rgba(241,34,45,.45);
    }
    .nh-logo-name { font-size:19px; font-weight:800; letter-spacing:-.4px; }
    .nh-logo-tag {
      font-size:10px; font-weight:700; letter-spacing:.5px;
      color:var(--brand); background:var(--brandSoft);
      padding:2px 7px; border-radius:5px; text-transform:uppercase;
    }
    .nh-logo-sub { font-size:11px; color:var(--text3); font-weight:500; margin-top:1px; }

    .nh-badges { display:flex; align-items:center; gap:7px; margin-left:10px; }
    .nh-badge {
      display:inline-flex; align-items:center; gap:6px;
      font-size:11.5px; font-weight:600;
      padding:4px 10px; border-radius:8px;
    }
    .nh-badge-g { color:var(--emerald); background:var(--emeraldSoft); }
    .nh-badge-i { color:var(--indigo);  background:var(--indigoSoft); }
    .nh-badge-n { color:var(--text2); background:var(--card); border:1px solid var(--border); }
    .nh-pulse-dot {
      width:7px; height:7px; border-radius:50%;
      background:var(--emerald); flex-shrink:0;
      animation: nh-pulse 2s infinite;
    }
    .nh-spacer { flex:1; }

    .nh-btn-icon {
      width:38px; height:38px; border-radius:10px;
      border:1px solid var(--border); background:var(--card);
      color:var(--text2); display:grid; place-items:center;
      cursor:pointer; transition:background .15s, color .15s;
    }
    .nh-btn-icon:hover { background:var(--card2); color:var(--text); }
    .nh-btn-ghost {
      display:inline-flex; align-items:center; gap:7px;
      height:38px; padding:0 14px; border-radius:10px;
      border:1px solid var(--border); background:var(--card);
      color:var(--text2); font-size:13px; font-weight:600;
      cursor:pointer; transition:background .15s, color .15s;
    }
    .nh-btn-ghost:hover { background:var(--card2); color:var(--text); }
    .nh-btn-primary {
      display:inline-flex; align-items:center; gap:7px;
      height:38px; padding:0 16px; border-radius:10px;
      border:none; background:linear-gradient(150deg, var(--brand), var(--brand2));
      color:#fff; font-size:13px; font-weight:700;
      cursor:pointer; box-shadow:0 3px 10px -2px rgba(241,34,45,.45);
      transition:filter .15s;
    }
    .nh-btn-primary:hover { filter:brightness(1.07); }

    /* ===== MAIN ===== */
    .nh-main { max-width:1440px; margin:0 auto; padding:24px 28px 0; }

    /* ===== HERO ORBS ===== */
    .nh-hero { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:14px; }
    .nh-orb {
      position:relative; overflow:hidden;
      background:var(--card); border:1px solid var(--border);
      border-radius:16px; padding:18px 20px; box-shadow:var(--shadow);
    }
    .nh-orb-blob { position:absolute; right:-16px; top:-16px; width:84px; height:84px; border-radius:50%; }
    .nh-orb-top { display:flex; align-items:center; gap:9px; position:relative; }
    .nh-orb-icon { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; flex-shrink:0; }
    .nh-orb-label { font-size:12.5px; font-weight:600; color:var(--text2); }
    .nh-orb-value { font-size:32px; font-weight:800; letter-spacing:-1px; margin-top:11px; position:relative; }
    .nh-orb-trend { display:flex; align-items:center; gap:5px; margin-top:4px; font-size:12px; font-weight:600; position:relative; }

    /* ===== SHELL ===== */
    .nh-shell { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:14px; align-items:start; }
    .nh-col { display:flex; flex-direction:column; gap:14px; min-width:0; }

    /* ===== SUMMARY STRIP ===== */
    .nh-summary { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
    .nh-stat { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); }
    .nh-stat-row { display:flex; align-items:center; gap:8px; }
    .nh-stat-lbl { font-size:11.5px; font-weight:600; color:var(--text2); }
    .nh-stat-val { font-size:25px; font-weight:800; letter-spacing:-.6px; margin-top:7px; }

    /* ===== CARD ===== */
    .nh-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px 20px; box-shadow:var(--shadow); }
    .nh-card-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .nh-card-title { display:flex; align-items:center; gap:9px; font-size:15px; font-weight:700; letter-spacing:-.2px; }
    .nh-card-icon { width:28px; height:28px; border-radius:8px; background:var(--brandSoft); color:var(--brand); display:grid; place-items:center; flex-shrink:0; }
    .nh-live-badge { font-size:11px; font-weight:700; color:var(--emerald); background:var(--emeraldSoft); padding:2px 8px; border-radius:20px; }

    /* ===== LIVE ROOMS ===== */
    .nh-rooms { display:grid; grid-template-columns:repeat(2,1fr); gap:11px; }
    .nh-room { border:1px solid var(--border); border-radius:12px; padding:13px 15px; background:var(--card2); animation:nh-rise .3s ease both; }
    .nh-room-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .nh-room-name-grp { display:flex; align-items:center; gap:8px; min-width:0; }
    .nh-room-dot { width:7px; height:7px; border-radius:50%; background:var(--emerald); flex-shrink:0; animation:nh-pulse 2s infinite; }
    .nh-room-name { font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .nh-room-pill { font-size:10px; font-weight:700; padding:2px 7px; border-radius:5px; white-space:nowrap; }
    .nh-room-sub { font-size:11px; color:var(--text3); margin:4px 0 11px; font-family:'JetBrains Mono', monospace; }
    .nh-room-stats { display:flex; align-items:center; gap:15px; }
    .nh-room-stat { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; color:var(--text2); }

    /* ===== CHART TABS ===== */
    .nh-chart-tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:15px; }
    .nh-ctab {
      height:31px; padding:0 13px; border-radius:8px;
      border:1px solid var(--border); background:var(--card);
      color:var(--text2); font-size:12.5px; font-weight:600;
      cursor:pointer; white-space:nowrap;
      transition:background .12s, color .12s, border-color .12s;
    }
    .nh-ctab.active { background:var(--text); color:var(--card); border-color:var(--text); }
    .nh-cpane { display:none; }
    .nh-cpane.active { display:block; }
    .nh-cwrap { position:relative; height:260px; }
    .nh-cwrap.sm { height:220px; }

    /* ===== EXPLORE TABS ===== */
    .nh-etabs { display:flex; gap:6px; margin-bottom:15px; }
    .nh-etab {
      height:34px; padding:0 14px; border-radius:8px;
      border:1px solid var(--border); background:var(--card);
      color:var(--text2); font-size:13px; font-weight:600;
      cursor:pointer; transition:background .12s, color .12s, border-color .12s;
    }
    .nh-etab.active { background:var(--text); color:var(--card); border-color:var(--text); }

    /* ===== TABLE ===== */
    .nh-tbl-wrap { border:1px solid var(--border); border-radius:12px; overflow:hidden; }
    .nh-tbl { width:100%; border-collapse:collapse; font-size:13px; }
    .nh-tbl thead tr { background:var(--card2); }
    .nh-tbl th { text-align:left; padding:10px 14px; font-size:11px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:.5px; border-bottom:1px solid var(--border); white-space:nowrap; }
    .nh-tbl td { padding:11px 14px; border-bottom:1px solid var(--border2); vertical-align:middle; }
    .nh-tbl tbody tr:last-child td { border-bottom:none; }
    .nh-tbl tbody tr:hover { background:var(--card2); }
    .nh-tlink { border:none; background:none; padding:0; color:var(--brand); font-weight:700; font-size:13px; cursor:pointer; text-align:left; font-family:inherit; }
    .nh-tlink:hover { text-decoration:underline; }
    .nh-muted { color:var(--text2); }
    .nh-mono { font-family:'JetBrains Mono',monospace; font-size:11px; }

    /* ===== DETAIL PANEL ===== */
    .nh-detail { background:var(--card2); border:1px solid var(--border); border-radius:14px; padding:18px; margin-top:14px; }
    .nh-detail-hdr { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:15px; }
    .nh-detail-title { font-size:20px; font-weight:800; letter-spacing:-.3px; }
    .nh-detail-sub { font-size:12px; color:var(--text3); margin-top:3px; }
    .nh-detail-pill { display:inline-flex; align-items:center; padding:4px 12px; border-radius:20px; background:var(--brandSoft); color:var(--brand); font-size:12px; font-weight:700; white-space:nowrap; }
    .nh-metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin-bottom:15px; }
    .nh-metric { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:11px 14px; text-align:center; }
    .nh-metric-lbl { font-size:10px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:.4px; }
    .nh-metric-val { font-size:20px; font-weight:800; margin-top:4px; }
    .nh-list-hdr { font-size:13px; font-weight:700; margin-bottom:9px; margin-top:13px; }
    .nh-list-item { display:flex; align-items:flex-start; gap:9px; padding:9px 11px; border-radius:9px; background:var(--card); border:1px solid var(--border); margin-bottom:6px; }
    .nh-avatar { width:28px; height:28px; border-radius:8px; display:grid; place-items:center; font-size:11px; font-weight:800; flex-shrink:0; }
    .nh-empty { padding:28px; text-align:center; color:var(--text3); }
    .nh-empty h3 { margin-top:8px; font-size:15px; color:var(--text2); }
    .nh-empty p  { font-size:12.5px; margin-top:5px; }

    /* ===== HISTORY ===== */
    .nh-hist-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:11px; align-items:center; }
    .nh-hist-sel, .nh-hist-inp { height:36px; padding:0 12px; border-radius:9px; border:1px solid var(--border); background:var(--card2); color:var(--text); font-size:13px; }
    .nh-hist-sel:focus, .nh-hist-inp:focus { outline:none; border-color:var(--brand); background:var(--card); }
    .nh-srch-wrap { position:relative; display:flex; align-items:center; }
    .nh-srch-ico { position:absolute; left:10px; color:var(--text3); pointer-events:none; display:flex; align-items:center; }
    .nh-srch-inp { height:36px; width:200px; padding:0 12px 0 34px; border-radius:9px; border:1px solid var(--border); background:var(--card2); color:var(--text); font-size:13px; }
    .nh-srch-inp:focus { outline:none; border-color:var(--brand); background:var(--card); }
    .nh-pgn { display:flex; align-items:center; justify-content:space-between; margin-top:12px; font-size:12px; color:var(--text3); }
    .nh-pgn-btn { height:31px; padding:0 12px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text2); font-size:12px; font-weight:600; font-family:inherit; cursor:pointer; }
    .nh-pgn-btn:disabled { opacity:.45; cursor:not-allowed; }
    .nh-pgn-btn:not(:disabled):hover { color:var(--text); background:var(--card2); }

    /* ===== STATUS ===== */
    .nh-s-live { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; color:var(--emerald); background:var(--emeraldSoft); padding:2px 9px; border-radius:20px; }
    .nh-s-live span { width:6px; height:6px; border-radius:50%; background:var(--emerald); animation:nh-pulse 2s infinite; }
    .nh-chip { display:inline-flex; align-items:center; padding:2px 9px; border-radius:20px; background:var(--slateSoft); color:var(--slate); font-size:11px; font-weight:700; }

    /* ===== SIDEBAR ===== */
    .nh-sidebar { display:flex; flex-direction:column; gap:14px; position:sticky; top:76px; }
    .nh-lb-hdr { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
    .nh-lb-ico { width:26px; height:26px; border-radius:8px; display:grid; place-items:center; flex-shrink:0; }
    .nh-lb-title { margin:0; font-size:13.5px; font-weight:700; }
    .nh-lb-row { display:flex; align-items:center; gap:9px; padding:6px 5px; border-radius:9px; cursor:pointer; }
    .nh-lb-row:hover { background:var(--card2); }
    .nh-lb-rank { width:20px; font-size:12px; font-weight:800; color:var(--text3); text-align:center; flex-shrink:0; }
    .nh-lb-info { min-width:0; flex:1; }
    .nh-lb-name { font-size:12.5px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .nh-lb-sub  { font-size:10.5px; color:var(--text3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .nh-lb-val  { font-size:13px; font-weight:700; flex-shrink:0; }
    .nh-lb-av { width:28px; height:28px; border-radius:9px; display:grid; place-items:center; font-size:11px; font-weight:800; flex-shrink:0; }

    /* ===== RESPONSIVE ===== */
    @media (max-width:1220px) { .nh-shell { grid-template-columns:1fr; } .nh-sidebar { position:static; } }
    @media (max-width:900px)  { .nh-hero { grid-template-columns:repeat(2,1fr); } .nh-summary { grid-template-columns:repeat(2,1fr); } .nh-rooms { grid-template-columns:1fr; } }
    @media (max-width:640px)  { .nh-main { padding:14px 14px 0; } .nh-header-inner { padding:11px 14px; } .nh-badges { display:none; } .nh-hero { grid-template-columns:1fr; } .nh-metrics { grid-template-columns:repeat(2,1fr); } }
  </style>
</head>
<body>

<!-- ==================== HEADER ==================== -->
<header class="nh-header">
  <div class="nh-header-inner">
    <div class="nh-logo">
      <div class="nh-logo-box">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c3 2.6 9 2.6 12 0v-5"/>
        </svg>
      </div>
      <div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="nh-logo-name">Nihaoma</span>
          <!-- <span class="nh-logo-tag">BBB Admin</span> -->
        </div>
        <!-- <div class="nh-logo-sub">Real-time BigBlueButton analytics</div> -->
      </div>
    </div>

    <!-- <div class="nh-badges">
      <span class="nh-badge nh-badge-g"><span class="nh-pulse-dot"></span>BBB Connected</span>
      <span class="nh-badge nh-badge-i">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>
        Webhook Active
      </span>
      <span class="nh-badge nh-badge-n">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        Live Sync
      </span>
    </div> -->

    <div class="nh-spacer"></div>

    <div style="display:flex;align-items:center;gap:9px;">
      <button class="nh-btn-icon" id="themeToggle" title="Toggle theme">
        <svg id="iconSun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg id="iconMoon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
      <button class="nh-btn-ghost" id="resetButton">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
        Reset Data
      </button>
      <button class="nh-btn-primary" id="registerHookBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>
        Register Hook
      </button>
    </div>
  </div>
</header>

<!-- ==================== MAIN ==================== -->
<main class="nh-main">

  <!-- HERO ORBS -->
  <div class="nh-hero" id="heroOrbs"></div>

  <!-- 2-COL SHELL -->
  <div class="nh-shell">

    <!-- MAIN COLUMN -->
    <div class="nh-col">

      <!-- Summary strip -->
      <div class="nh-summary" id="summaryStrip"></div>

      <!-- Live rooms -->
      <div class="nh-card">
        <div class="nh-card-hdr">
          <div class="nh-card-title">
            <span class="nh-room-dot" style="width:8px;height:8px;flex-shrink:0;"></span>
            Live Active Rooms
            <span class="nh-live-badge" id="liveCount">0 live</span>
          </div>
          <span style="font-size:12px;color:var(--text3);font-weight:500;" id="livePax">0 participants</span>
        </div>
        <div class="nh-rooms" id="liveRooms"></div>
      </div>

      <!-- Analytics -->
      <div class="nh-card">
        <div class="nh-card-hdr">
          <div class="nh-card-title">
            <span class="nh-card-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 16v-5M12 16V8M17 16v-3"/></svg>
            </span>
            Analytics
          </div>
        </div>
        <div class="nh-chart-tabs">
          <button class="nh-ctab active" data-chart="activity">Activity</button>
          <button class="nh-ctab" data-chart="peak">Peak Hours</button>
          <button class="nh-ctab" data-chart="duration">Duration</button>
          <button class="nh-ctab" data-chart="participants">Participants</button>

            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>

<script>
// ============================================================
//  STATE
// ============================================================
let eventSource;
const state = {
  stats: null,
  activeTab: "classes",
  activeChart: "activity",
  selectedClassId: null,
  selectedTeacherId: null,
  selectedStudentId: null
};

function getTodayDate() { return new Date().toISOString().split("T")[0]; }

const historyState = {
  searchType: "classes", searchQuery: "",
  dateFrom: getTodayDate(), dateTo: getTodayDate(),
  page: 1, results: null, loading: false
};

const classFilterState = {
  search: "", dateFrom: getTodayDate(), dateTo: getTodayDate(),
  page: 1, results: null, loading: false
};

// ============================================================
//  THEME
// ============================================================
function initTheme() { applyTheme(localStorage.getItem("nh-theme") || "light"); }

function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  document.getElementById("iconSun").style.display  = t === "dark" ? "none"  : "block";
  document.getElementById("iconMoon").style.display = t === "dark" ? "block" : "none";
}

function toggleTheme() {
  const nxt = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  localStorage.setItem("nh-theme", nxt);
  applyTheme(nxt);
}

// ============================================================
//  CHART TABS
// ============================================================
const chartInstances = {};

function switchChartTab(id) {
  state.activeChart = id;
  document.querySelectorAll(".nh-ctab").forEach(b => b.classList.toggle("active", b.dataset.chart === id));
  document.querySelectorAll(".nh-cpane").forEach(p => p.classList.toggle("active", p.id === "chart-" + id));
  const map = { activity:chartInstances.meetingActivity, peak:chartInstances.peakUsage, duration:chartInstances.durationTrend, participants:chartInstances.participant, events:chartInstances.eventType, workload:chartInstances.teacherWorkload };
  if (map[id]) setTimeout(() => map[id].resize(), 10);
}

// ============================================================
//  FORMATTERS
// ============================================================
function fmt(v) { return v ?? 0; }

function fmtDT(v) {
  if (!v) return "-";
  const d = new Date(v);
  if (isNaN(d.getTime())) return "-";
  return d.toLocaleString("vi-VN", { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" });
}

function fmtDTen(v) {
  if (!v) return "-";
  const d = new Date(v);
  if (isNaN(d.getTime())) return "-";
  return d.toLocaleString("en-US");
}

function initials(name) {
  if (!name) return "?";
  return name.split(/\s+/).map(p => p[0]).join("").toUpperCase().slice(0, 2);
}

// ============================================================
//  HERO ORBS
// ============================================================
function renderHeroOrbs(data) {
  const el = document.getElementById("heroOrbs");
  if (!el) return;
  const orbs = [
    { lbl:"Total Events",        val:fmt(data.totals?.events),             bg:"var(--slateSoft)",  ic:"var(--slate)",   tc:"var(--text3)",   icon:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>`,        trend:"all webhook events" },
    { lbl:"Meetings Created",     val:fmt(data.totals?.meetingsCreated),    bg:"var(--indigoSoft)", ic:"var(--indigo)",  tc:"var(--indigo)",  icon:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>`, trend:"total created" },
    { lbl:"Participants Joined",  val:fmt(data.totals?.participantsJoined), bg:"var(--emeraldSoft)",ic:"var(--emerald)", tc:"var(--emerald)", icon:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>`, trend:"total joins" },
    { lbl:"Participants Left",    val:fmt(data.totals?.participantsLeft),   bg:"var(--amberSoft)",  ic:"var(--amber)",   tc:"var(--text3)",   icon:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>`,  trend:"total leaves" }
  ];
  el.innerHTML = orbs.map(o => `
    <div class="nh-orb">
      <div class="nh-orb-blob" style="background:${o.bg};"></div>
      <div class="nh-orb-top">
        <span class="nh-orb-icon" style="background:${o.bg};color:${o.ic};">${o.icon}</span>
        <span class="nh-orb-label">${o.lbl}</span>
      </div>
      <div class="nh-orb-value">${o.val}</div>
      <div class="nh-orb-trend" style="color:${o.tc};">${o.trend}</div>
    </div>`).join("");
}

// ============================================================
//  SUMMARY STRIP
// ============================================================
function renderSummaryStrip(data) {
  const el = document.getElementById("summaryStrip");
  if (!el) return;
  const items = [
    { lbl:"Unique Meetings", val:fmt(data.summary?.uniqueMeetings), c:"var(--indigo)",  icon:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>` },
    { lbl:"Unique Users",    val:fmt(data.summary?.uniqueUsers),    c:"var(--emerald)", icon:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>` },
    { lbl:"Unique Classes",  val:fmt(data.summary?.uniqueClasses),  c:"var(--brand)",   icon:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c3 2.6 9 2.6 12 0v-5"/></svg>` },
    { lbl:"Unique Teachers", val:fmt(data.summary?.uniqueTeachers), c:"var(--amber)",   icon:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>` }
  ];
  el.innerHTML = items.map(s => `
    <div class="nh-stat">
      <div class="nh-stat-row"><span style="color:${s.c};">${s.icon}</span><span class="nh-stat-lbl">${s.lbl}</span></div>
      <div class="nh-stat-val">${s.val}</div>
    </div>`).join("");
}

// ============================================================
//  LIVE ROOMS
// ============================================================
const ROOM_CLR  = ["#f1222d","#4f46e5","#0f9d6e","#d97706","#8b5cf6","#0891b2"];
const ROOM_SOFT = ["#fdecec","#eef0fe","#e6f7f0","#fdf2e3","#f3e8ff","#e0f2fe"];

function renderLiveRooms(data) {
  const rooms = data.liveRooms || [];
  document.getElementById("liveCount").textContent = rooms.length + " live";
  document.getElementById("livePax").textContent = rooms.reduce((s,r) => s+(r.attendeeCount||0),0) + " participants now";
  const el = document.getElementById("liveRooms");
  if (!rooms.length) {
    el.innerHTML = `<div class="nh-empty" style="grid-column:span 2;">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto;display:block;opacity:.3;"><path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
      <h3>No active classes</h3><p>Meetings appear here in real time when they start.</p></div>`;
    return;
  }
  el.innerHTML = rooms.map((r,i) => {
    const c = ROOM_CLR[i%ROOM_CLR.length], s = ROOM_SOFT[i%ROOM_SOFT.length];
    return `<div class="nh-room" style="border-left:3px solid ${c};">
      <div class="nh-room-top">
        <div class="nh-room-name-grp"><span class="nh-room-dot"></span><span class="nh-room-name">${r.meetingName||r.meetingId||"Unnamed"}</span></div>
        <span class="nh-room-pill" style="color:${c};background:${s};">LIVE</span>
      </div>
      <div class="nh-room-sub">${r.meetingId||"-"} · ${r.teacherId||"No teacher"}</div>
      <div class="nh-room-stats">
        <span class="nh-room-stat"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>${r.attendeeCount||0}</span>
        <span class="nh-room-stat"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>${r.moderatorCount||0} mod</span>
        <span class="nh-room-stat"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>${r.running||"running"}</span>
      </div>
    </div>`;
  }).join("");
}

// ============================================================
//  SIDEBAR
// ============================================================
function renderSidebar(data) {
  const cls = document.getElementById("topClassesList");
  if (cls) cls.innerHTML = (data.topClasses||[]).slice(0,5).map((it,i) => `
    <div class="nh-lb-row">
      <span class="nh-lb-rank">${i+1}</span>
      <div class="nh-lb-info"><div class="nh-lb-name">${it.className||it.classId||"-"}</div><div class="nh-lb-sub">${it.teachers||0} teachers · ${it.students||0} students</div></div>
      <span class="nh-lb-val" style="color:var(--brand);">${it.joinEvents||0}</span>
    </div>`).join("") || noData();

  const tch = document.getElementById("topTeachersList");
  if (tch) tch.innerHTML = (data.topTeachers||[]).slice(0,5).map(it => `
    <div class="nh-lb-row">
      <span class="nh-lb-av" style="background:var(--amberSoft);color:var(--amber);">${initials(it.teacherId)}</span>
      <div class="nh-lb-info"><div class="nh-lb-name">${it.teacherId||"-"}</div><div class="nh-lb-sub">${it.classes||0} classes · ${it.students||0} students</div></div>
      <span class="nh-lb-val" style="color:var(--amber);">${it.joinEvents||0}</span>
    </div>`).join("") || noData();

  const stu = document.getElementById("topStudentsList");
  if (stu) stu.innerHTML = (data.topStudents||[]).slice(0,5).map(it => `
    <div class="nh-lb-row">
      <span class="nh-lb-av" style="background:var(--emeraldSoft);color:var(--emerald);">${initials(it.userName||it.userId)}</span>
      <div class="nh-lb-info"><div class="nh-lb-name">${it.userName||it.userId||"-"}</div><div class="nh-lb-sub">${it.classes||0} classes · ${it.joins||0} joins</div></div>
      <span class="nh-lb-val" style="color:var(--emerald);">${it.joins||0}</span>
    </div>`).join("") || noData();
}

function noData() { return `<div style="font-size:12px;color:var(--text3);padding:8px 6px;">No data yet</div>`; }

// ============================================================
//  TABLES
// ============================================================
function renderClassesTable(data) {
  const isFiltered = !!(classFilterState.search || classFilterState.dateFrom || classFilterState.dateTo || classFilterState.results);
  const filterBar = `
    <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:13px;padding:12px 14px;background:var(--card2);border:1px solid var(--border);border-radius:11px;">
      <div class="nh-srch-wrap">
        <span class="nh-srch-ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span>
        <input type="text" id="clsSearch" class="nh-srch-inp" placeholder="Tìm lớp…" value="${classFilterState.search}" style="width:160px;"/>
      </div>
      <span style="font-size:12px;color:var(--text3);">Từ:</span>
      <input type="date" id="clsFrom" class="nh-hist-inp" value="${classFilterState.dateFrom}" style="height:34px;"/>
      <span style="font-size:12px;color:var(--text3);">Đến:</span>
      <input type="date" id="clsTo" class="nh-hist-inp" value="${classFilterState.dateTo}" style="height:34px;"/>
      <button id="clsApply" class="nh-btn-primary" style="height:34px;padding:0 14px;font-size:12.5px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        Lọc
      </button>
      ${isFiltered ? `<button id="clsClear" class="nh-btn-ghost" style="height:34px;font-size:12.5px;">Xoá filter</button>` : ""}
      ${classFilterState.loading ? `<span style="font-size:12px;color:var(--text3);">Đang tải…</span>` : ""}
      ${classFilterState.results ? `<span style="font-size:12px;color:var(--emerald);font-weight:600;">${classFilterState.results.pagination.total} kết quả</span>` : ""}
    </div>`;

  let rows, tblSource;
  if (classFilterState.results) {
    tblSource = classFilterState.results.data;
    rows = tblSource.map(it => `<tr>
      <td><button class="nh-tlink" data-class-id="${it.classId}">${it.className||it.classId||"-"}</button></td>
      <td class="nh-muted nh-mono">${fmtDTen(it.createdAt)}</td>
      <td>${it.teacherCount||0}</td><td>${it.studentCount||0}</td><td>${it.joinEvents||0}</td><td>${it.leaveEvents||0}</td>
    </tr>`).join("") || `<tr><td colspan="6" style="padding:20px;text-align:center;color:var(--text3);">Không tìm thấy lớp nào</td></tr>`;
  } else {
    tblSource = data.topClasses || [];
    rows = tblSource.map(it => `<tr>
      <td><button class="nh-tlink" data-class-id="${it.classId}">${it.className||it.classId||"-"}</button></td>
      <td class="nh-muted nh-mono">${fmtDT(it.createdAt)}</td>
      <td>${it.teachers||0}</td><td>${it.students||0}</td><td>${it.joinEvents||0}</td><td>${it.leaveEvents||0}</td>
    </tr>`).join("") || `<tr><td colspan="6" style="padding:20px;text-align:center;color:var(--text3);">No data</td></tr>`;
  }

  const pgn = classFilterState.results ? (() => {
    const p = classFilterState.results.pagination;
    if (p.totalPages <= 1) return "";
    return `<div class="nh-pgn" style="margin-top:11px;">
      <span>Trang ${p.page} / ${p.totalPages} · ${p.total} lớp</span>
      <div style="display:flex;gap:6px;">
        <button class="nh-pgn-btn cls-page-btn" data-page="${p.page-1}" ${p.page<=1?"disabled":""}>Trước</button>
        <button class="nh-pgn-btn cls-page-btn" data-page="${p.page+1}" ${p.page>=p.totalPages?"disabled":""}>Sau</button>
      </div>
    </div>`;
  })() : "";

  return filterBar + `<div class="nh-tbl-wrap"><table class="nh-tbl">
    <thead><tr><th>Lớp</th><th>Ngày tạo</th><th>GV</th><th>HS</th><th>Joins</th><th>Leaves</th></tr></thead>
    <tbody>${rows}</tbody></table></div>` + pgn;
}

async function performClassesFilter() {
  classFilterState.loading = true;
  renderCurrentView();
  try {
    const p = new URLSearchParams();
    if (classFilterState.search)   p.set("search", classFilterState.search);
    if (classFilterState.dateFrom) p.set("from",   classFilterState.dateFrom);
    if (classFilterState.dateTo)   p.set("to",     classFilterState.dateTo);
    p.set("page", classFilterState.page);
    p.set("limit", "20");
    const res = await fetch(`/api/history/classes?${p}`);
    const js  = await res.json();
    classFilterState.results = js.ok ? js : { data:[], pagination:{page:1,limit:20,total:0,totalPages:0} };
  } catch(e) {
    classFilterState.results = { data:[], pagination:{page:1,limit:20,total:0,totalPages:0} };
  }
  classFilterState.loading = false;
  renderCurrentView();
}

function bindClassFilterInteractions() {
  const srch  = document.getElementById("clsSearch");
  const df    = document.getElementById("clsFrom");
  const dt    = document.getElementById("clsTo");
  const apply = document.getElementById("clsApply");
  const clear = document.getElementById("clsClear");

  if (srch) {
    srch.oninput    = () => { classFilterState.search = srch.value; };
    srch.onkeypress = e  => { if (e.key==="Enter") { classFilterState.page=1; performClassesFilter(); } };
  }
  if (df) df.onchange = () => { classFilterState.dateFrom = df.value; };
  if (dt) dt.onchange = () => { classFilterState.dateTo   = dt.value; };
  if (apply) apply.onclick = () => { classFilterState.page=1; performClassesFilter(); };
  if (clear) clear.onclick = () => {
    classFilterState.search=""; classFilterState.dateFrom=""; classFilterState.dateTo="";
    classFilterState.page=1; classFilterState.results=null;
    renderCurrentView();
  };
  document.querySelectorAll(".cls-page-btn").forEach(b => {
    b.onclick = () => { const pg=parseInt(b.dataset.page,10); if(pg>=1){ classFilterState.page=pg; performClassesFilter(); } };
  });
}

function renderTeachersTable(data) {
  const rows = (data.topTeachers||[]).map(it => `<tr>
    <td><button class="nh-tlink" data-teacher-id="${it.teacherId}">${it.teacherId||"-"}</button></td>
    <td>${it.classes||0}</td><td>${it.students||0}</td><td>${it.joinEvents||0}</td><td>${it.leaveEvents||0}</td>
  </tr>`).join("") || `<tr><td colspan="5" style="padding:20px;text-align:center;color:var(--text3);">No data</td></tr>`;
  return `<div class="nh-tbl-wrap"><table class="nh-tbl"><thead><tr><th>Teacher</th><th>Classes</th><th>Students</th><th>Joins</th><th>Leaves</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderStudentsTable(data) {
  const rows = (data.topStudents||[]).map(it => `<tr>
    <td><button class="nh-tlink" data-student-id="${it.userId}">${it.userName||it.userId||"-"}</button></td>
    <td>${it.classes||0}</td><td>${it.teachers||0}</td><td>${it.joins||0}</td><td>${it.leaves||0}</td>
  </tr>`).join("") || `<tr><td colspan="5" style="padding:20px;text-align:center;color:var(--text3);">No data</td></tr>`;
  return `<div class="nh-tbl-wrap"><table class="nh-tbl"><thead><tr><th>Student</th><th>Classes</th><th>Teachers</th><th>Joins</th><th>Leaves</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ============================================================
//  DETAIL PANELS
// ============================================================
function activityTable(rows) {
  if (!rows||!rows.length) return "";
  return `<div style="margin-top:14px;"><div class="nh-list-hdr">Room Activity</div><div style="overflow-x:auto;"><div class="nh-tbl-wrap"><table class="nh-tbl">
    <thead><tr><th>Name</th><th>Mod</th><th>Score</th><th>Talk</th><th>Webcam</th><th>Msgs</th><th>React</th><th>Polls</th><th>Hands</th><th>Joined</th><th>Left</th><th>Dur</th></tr></thead>
    <tbody>${rows.map(it => `<tr>
      <td>${it.name||"-"}</td><td>${it.moderator?"✓":"-"}</td><td>${it.activityScore??0}</td>
      <td>${it.talkTime||"-"}</td><td>${it.webcamTime||"-"}</td>
      <td>${it.messages??0}</td><td>${it.reactions??0}</td><td>${it.pollVotes??0}</td><td>${it.raiseHands??0}</td>
      <td class="nh-muted nh-mono">${fmtDTen(it.joinAt)}</td>
      <td class="nh-muted nh-mono">${fmtDTen(it.leftAt)}</td>
      <td>${it.duration||"-"}</td>
    </tr>`).join("")}</tbody>
  </table></div></div></div>`;
}

function renderClassDetail(data) {
  const s = data.classDetails.find(x => x.classId===state.selectedClassId) || data.classDetails[0];
  if (!s) return emptyDetail("No class data available.");
  state.selectedClassId = s.classId;
  return `<div class="nh-detail">
    <div class="nh-detail-hdr">
      <div><div class="nh-detail-title">${s.className||s.classId}</div><div class="nh-detail-sub nh-mono">${s.classId}</div></div>
      <span class="nh-detail-pill">${s.totals.joinEvents} joins</span>
    </div>
    <div class="nh-metrics">
      <div class="nh-metric"><div class="nh-metric-lbl">Teachers</div><div class="nh-metric-val">${s.totals.teachers}</div></div>
      <div class="nh-metric"><div class="nh-metric-lbl">Students</div><div class="nh-metric-val">${s.totals.students}</div></div>
      <div class="nh-metric"><div class="nh-metric-lbl">Joins</div><div class="nh-metric-val">${s.totals.joinEvents}</div></div>
      <div class="nh-metric"><div class="nh-metric-lbl">Leaves</div><div class="nh-metric-val">${s.totals.leaveEvents}</div></div>
    </div>
    <div class="nh-list-hdr">Teachers</div>
    ${(s.teachers||[]).map(t => { const tm=(s.meetings||[]).filter(m=>m.teacherId===t.teacherId).length; return `<div class="nh-list-item">
      <span class="nh-avatar" style="background:var(--amberSoft);color:var(--amber);">${initials(t.teacherName||t.teacherId)}</span>
      <div><div style="font-size:13px;font-weight:600;">${t.teacherName||t.teacherId||"-"}</div><div style="font-size:11px;color:var(--text3);">${tm} meeting${tm!==1?"s":""}</div></div>
    </div>`; }).join("") || `<div class="nh-list-item"><span class="nh-muted">No teachers</span></div>`}
    <div class="nh-list-hdr" style="margin-top:16px;">Top Students</div>
    ${(s.students||[]).slice(0,6).map(st => `<div class="nh-list-item">
      <span class="nh-avatar" style="background:var(--emeraldSoft);color:var(--emerald);">${initials(st.userName||st.userId)}</span>
      <div><div style="font-size:13px;font-weight:600;">${st.userName||st.userId}</div><div style="font-size:11px;color:var(--text3);">${st.joinCount} joins · ${st.leaveCount} leaves</div></div>
    </div>`).join("") || `<div class="nh-list-item"><span class="nh-muted">No students</span></div>`}
    ${activityTable(s.participantActivity||[])}
  </div>`;
}

  return `<div class="nh-detail nh-empty"><h3>${msg}</h3></div>`;
}

// ============================================================
//  HISTORY
// ============================================================
function renderHistorySearchForm() {
  return `<div>
    <div class="nh-hist-row">
      <select id="historySearchType" class="nh-hist-sel">
        <option value="classes"  ${historyState.searchType==="classes"  ?"selected":""}>Classes</option>
        <option value="teachers" ${historyState.searchType==="teachers" ?"selected":""}>Teachers</option>
        <option value="students" ${historyState.searchType==="students" ?"selected":""}>Students</option>
        <option value="meetings" ${historyState.searchType==="meetings" ?"selected":""}>Meetings</option>
        <option value="events"   ${historyState.searchType==="events"   ?"selected":""}>Events</option>
      </select>
      <div class="nh-srch-wrap">
        <span class="nh-srch-ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span>
        <input type="text" id="historySearchQuery" class="nh-srch-inp" placeholder="Search…" value="${historyState.searchQuery}"/>
      </div>
    </div>
    <div class="nh-hist-row" style="margin-bottom:14px;">
      <span style="font-size:12px;color:var(--text3);">From:</span>
      <input type="date" id="historyDateFrom" class="nh-hist-inp" value="${historyState.dateFrom}"/>
      <span style="font-size:12px;color:var(--text3);">To:</span>
      <input type="date" id="historyDateTo" class="nh-hist-inp" value="${historyState.dateTo}"/>
      <button id="historySearchBtn" class="nh-btn-primary" style="height:36px;padding:0 16px;font-size:13px;">Search</button>
      <button id="historyClearBtn" class="nh-btn-ghost" style="height:36px;">Clear</button>
    </div>
    ${historyState.loading?"<div class=\"nh-muted\" style=\"padding:14px;\">Loading…</div>":""}
    ${renderHistoryResults()}
  </div>`;
}

function renderHistoryResults() {
  if (!historyState.results) return `<div class="nh-empty"><h3>Enter search criteria above</h3><p>Search for historical classes, teachers, students, meetings, or events.</p></div>`;
  const { data, pagination } = historyState.results;
  if (!data||!data.length) return `<div class="nh-empty"><h3>No data found</h3><p>Try adjusting your search criteria.</p></div>`;

  const live = `<span class="nh-s-live"><span></span>Running</span>`;
  let tbl = "";
  if (historyState.searchType==="classes") {
    tbl=`<div class="nh-tbl-wrap"><table class="nh-tbl"><thead><tr><th>Class</th><th>Teachers</th><th>Students</th><th>Meetings</th><th>Joins</th><th>Created</th><th>Last Ended</th></tr></thead><tbody>
    ${data.map(it=>`<tr><td><strong>${it.className||it.classId}</strong></td><td>${it.teacherCount}</td><td>${it.studentCount}</td><td>${it.meetingCount}</td><td>${it.joinEvents}</td><td class="nh-muted nh-mono">${fmtDTen(it.createdAt)}</td><td>${it.lastEndedAt?`<span class="nh-muted nh-mono">${fmtDTen(it.lastEndedAt)}</span>`:live}</td></tr>`).join("")}
    </tbody></table></div>`;
  } else if (historyState.searchType==="teachers") {
    tbl=`<div class="nh-tbl-wrap"><table class="nh-tbl"><thead><tr><th>Teacher</th><th>Classes</th><th>Students</th><th>Meetings</th><th>Joins</th><th>Created</th></tr></thead><tbody>
    ${data.map(it=>`<tr><td><strong>${it.teacherName||it.teacherId}</strong></td><td>${it.classCount}</td><td>${it.studentCount}</td><td>${it.meetingCount}</td><td>${it.joinEvents}</td><td class="nh-muted nh-mono">${fmtDTen(it.createdAt)}</td></tr>`).join("")}
    </tbody></table></div>`;
  } else if (historyState.searchType==="students") {
    tbl=`<div class="nh-tbl-wrap"><table class="nh-tbl"><thead><tr><th>Student</th><th>ID</th><th>Classes</th><th>Joins</th><th>Leaves</th><th>Created</th></tr></thead><tbody>
    ${data.map(it=>`<tr><td><strong>${it.userName||it.userId}</strong></td><td class="nh-mono">${it.userId}</td><td>${it.classCount}</td><td>${it.totalJoins}</td><td>${it.totalLeaves}</td><td class="nh-muted nh-mono">${fmtDTen(it.createdAt)}</td></tr>`).join("")}
    </tbody></table></div>`;
  } else if (historyState.searchType==="meetings") {
    tbl=`<div class="nh-tbl-wrap"><table class="nh-tbl"><thead><tr><th>Meeting</th><th>Class</th><th>Teacher</th><th>Participants</th><th>Joins</th><th>Started</th><th>Ended</th></tr></thead><tbody>
    ${data.map(it=>`<tr><td><strong>${it.meetingName||it.meetingId}</strong></td><td>${it.classId||"-"}</td><td>${it.teacherId||"-"}</td><td>${it.participantCount}</td><td>${it.joinEvents}</td><td class="nh-muted nh-mono">${fmtDTen(it.startedAt)}</td><td>${it.endedAt?`<span class="nh-muted nh-mono">${fmtDTen(it.endedAt)}</span>`:live}</td></tr>`).join("")}
    </tbody></table></div>`;
  } else if (historyState.searchType==="events") {
    tbl=`<div class="nh-tbl-wrap"><table class="nh-tbl"><thead><tr><th>Event</th><th>Meeting</th><th>User</th><th>Class</th><th>Timestamp</th></tr></thead><tbody>
    ${data.map(it=>`<tr><td><span class="nh-chip">${it.eventName}</span></td><td class="nh-mono">${it.meetingId||"-"}</td><td>${it.userName||it.userId||"-"}</td><td>${it.classId||"-"}</td><td class="nh-muted nh-mono">${fmtDTen(it.timestamp)}</td></tr>`).join("")}
    </tbody></table></div>`;
  }

  const pgn = pagination ? `<div class="nh-pgn">
    <span>Page ${pagination.page} of ${pagination.totalPages} · ${pagination.total} total</span>
    <div style="display:flex;gap:6px;">
      <button class="nh-pgn-btn history-page-btn" data-page="${pagination.page-1}" ${pagination.page<=1?"disabled":""}>Prev</button>
      <button class="nh-pgn-btn history-page-btn" data-page="${pagination.page+1}" ${pagination.page>=pagination.totalPages?"disabled":""}>Next</button>
    </div></div>` : "";

  return tbl + pgn;
}

function bindHistoryInteractions() {
  const sel=document.getElementById("historySearchType"),
        qry=document.getElementById("historySearchQuery"),
        df =document.getElementById("historyDateFrom"),
        dt =document.getElementById("historyDateTo"),
        go =document.getElementById("historySearchBtn"),
        cl =document.getElementById("historyClearBtn");
  if(sel) sel.onchange=()=>{historyState.searchType=sel.value;historyState.page=1;historyState.results=null;renderCurrentView();};
  if(qry){qry.oninput=()=>{historyState.searchQuery=qry.value;};qry.onkeypress=e=>{if(e.key==="Enter"){historyState.page=1;performHistorySearch();}};}
  if(df) df.onchange=()=>{historyState.dateFrom=df.value;};
  if(dt) dt.onchange=()=>{historyState.dateTo=dt.value;};
  if(go) go.onclick=()=>{historyState.page=1;performHistorySearch();};
  if(cl) cl.onclick=()=>{historyState.searchQuery="";historyState.dateFrom="";historyState.dateTo="";historyState.page=1;historyState.results=null;renderCurrentView();};
  document.querySelectorAll(".history-page-btn").forEach(b=>{b.onclick=()=>{const p=parseInt(b.dataset.page,10);if(p>=1){historyState.page=p;performHistorySearch();}};});
}

async function performHistorySearch() {
  historyState.loading=true; renderCurrentView();
  try {
    const p=new URLSearchParams();
    if(historyState.searchQuery) p.set("search",historyState.searchQuery);
    if(historyState.dateFrom)    p.set("from",historyState.dateFrom);
    if(historyState.dateTo)      p.set("to",historyState.dateTo);
    p.set("page",historyState.page); p.set("limit","20");
    const res=await fetch(`/api/history/${historyState.searchType}?${p}`);
    const js=await res.json();
    historyState.results=js.ok?js:{data:[],pagination:{page:1,limit:20,total:0,totalPages:0}};
  } catch(e) { historyState.results={data:[],pagination:{page:1,limit:20,total:0,totalPages:0}}; }
  historyState.loading=false; renderCurrentView();
}

// ============================================================
//  INTERACTIONS
// ============================================================
function bindInteractions() {
  document.querySelectorAll("[data-tab]").forEach(b=>{b.onclick=()=>{state.activeTab=b.dataset.tab;renderCurrentView();};});
  document.querySelectorAll("[data-class-id]").forEach(b=>{b.onclick=()=>{state.selectedClassId=b.dataset.classId;renderCurrentView();};});
  document.querySelectorAll("[data-teacher-id]").forEach(b=>{b.onclick=()=>{state.selectedTeacherId=b.dataset.teacherId;renderCurrentView();};});
  document.querySelectorAll("[data-student-id]").forEach(b=>{b.onclick=()=>{state.selectedStudentId=b.dataset.studentId;renderCurrentView();};});
}

// ============================================================
//  CHARTS
// ============================================================
function destroyCharts() {
  Object.values(chartInstances).forEach(c=>c&&c.destroy());
  Object.keys(chartInstances).forEach(k=>delete chartInstances[k]);
}

function renderCharts(data) {
  if (!data.chartData) return;
  destroyCharts();
  const cd=data.chartData, ac="#f1222d", as="rgba(241,34,45,.13)";
  const colors=["#f1222d","#4f46e5","#0f9d6e","#d97706","#8b5cf6","#0891b2"];

  const mCtx=document.getElementById("meetingActivityChart");
  if(mCtx&&cd.meetingActivityByDay) chartInstances.meetingActivity=new Chart(mCtx,{type:"line",data:{labels:cd.meetingActivityByDay.labels.map(d=>d.split("-").slice(1).join("/")),datasets:[{label:"Meetings",data:cd.meetingActivityByDay.meetings,borderColor:ac,backgroundColor:as,tension:.3,fill:false},{label:"Joins",data:cd.meetingActivityByDay.joins,borderColor:"#0f9d6e",backgroundColor:"rgba(15,157,110,.1)",tension:.3,fill:false},{label:"Leaves",data:cd.meetingActivityByDay.leaves,borderColor:"#d97706",backgroundColor:"rgba(217,119,6,.1)",tension:.3,fill:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:12}}},scales:{y:{beginAtZero:true}}}});

  const pCtx=document.getElementById("peakUsageChart");
  if(pCtx&&cd.peakUsageHours){const mx=Math.max(...cd.peakUsageHours.counts);chartInstances.peakUsage=new Chart(pCtx,{type:"bar",data:{labels:cd.peakUsageHours.labels,datasets:[{label:"Joins",data:cd.peakUsageHours.counts,backgroundColor:cd.peakUsageHours.counts.map(v=>v===mx?ac:as),borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});}

  const dCtx=document.getElementById("durationTrendChart");
  if(dCtx&&cd.classDurationTrend&&cd.classDurationTrend.labels.length) chartInstances.durationTrend=new Chart(dCtx,{type:"line",data:{labels:cd.classDurationTrend.labels.map(d=>d.split("-").slice(1).join("/")),datasets:[{label:"Avg Duration (min)",data:cd.classDurationTrend.avgDurations,borderColor:ac,backgroundColor:as,tension:.3,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});

  const paCtx=document.getElementById("participantChart");
  if(paCtx&&cd.participantDistribution) chartInstances.participant=new Chart(paCtx,{type:"doughnut",data:{labels:["Teachers","Students"],datasets:[{data:[cd.participantDistribution.teachers,cd.participantDistribution.students],backgroundColor:[ac,"#0f9d6e"],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:12}}},cutout:"60%"}});

  const etCtx=document.getElementById("eventTypeChart");
  if(etCtx&&cd.eventTypeBreakdown){const e=cd.eventTypeBreakdown;chartInstances.eventType=new Chart(etCtx,{type:"doughnut",data:{labels:["Joins","Leaves","Messages","Reactions","Polls","Hands"],datasets:[{data:[e.joins,e.leaves,e.messages,e.reactions,e.pollVotes,e.raiseHands],backgroundColor:colors,borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:10,font:{size:10}}}},cutout:"55%"}});}

  const twCtx=document.getElementById("teacherWorkloadChart");
  if(twCtx&&cd.teacherWorkload&&cd.teacherWorkload.length) chartInstances.teacherWorkload=new Chart(twCtx,{type:"doughnut",data:{labels:cd.teacherWorkload.map(t=>t.name.length>12?t.name.slice(0,12)+"…":t.name),datasets:[{data:cd.teacherWorkload.map(t=>t.classes),backgroundColor:colors,borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:10,font:{size:10}}}},cutout:"55%"}});
}

// ============================================================
//  MAIN RENDER
// ============================================================
function renderCurrentView() {
  const data=state.stats;
  if(!data) return;
  renderHeroOrbs(data);
  renderSummaryStrip(data);
  renderLiveRooms(data);
  renderCharts(data);
  renderSidebar(data);

  document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.activeTab));

  const tc=document.getElementById("tabContent"),dp=document.getElementById("detailPanel");
  if(state.activeTab==="classes"){tc.innerHTML=renderClassesTable(data);dp.innerHTML=renderClassDetail(data);bindClassFilterInteractions();}
  else if(state.activeTab==="teachers"){tc.innerHTML=renderTeachersTable(data);dp.innerHTML=renderTeacherDetail(data);}
  else if(state.activeTab==="history"){tc.innerHTML=renderHistorySearchForm();dp.innerHTML="";bindHistoryInteractions();}
  else{tc.innerHTML=renderStudentsTable(data);dp.innerHTML=renderStudentDetail(data);}

  bindInteractions();
}

function hydrateSelection(data) {
  if(!state.selectedClassId   && data.classDetails[0])   state.selectedClassId   = data.classDetails[0].classId;
  if(!state.selectedTeacherId && data.teacherDetails[0]) state.selectedTeacherId = data.teacherDetails[0].teacherId;
  if(!state.selectedStudentId && data.studentDetails[0]) state.selectedStudentId = data.studentDetails[0].userId;
}

async function loadStats() {
  const res=await fetch("/api/stats"), data=await res.json();
  state.stats=data; hydrateSelection(data); renderCurrentView();
}

async function postJson(url, payload) {
  const res=await fetch(url,{method:"POST",headers:payload?{"Content-Type":"application/json"}:undefined,body:payload?JSON.stringify(payload):undefined});
  return res.json();
}

function connectRealtime() {
  eventSource=new EventSource("/api/stream");
  eventSource.addEventListener("stats",ev=>{state.stats=JSON.parse(ev.data);hydrateSelection(state.stats);renderCurrentView();});
}

// ============================================================
//  BOOT
// ============================================================
initTheme();

document.getElementById("themeToggle").addEventListener("click", toggleTheme);

document.getElementById("resetButton").addEventListener("click", async () => {
  if(confirm("Reset all data? This cannot be undone.")) await postJson("/api/reset");
});

document.getElementById("registerHookBtn").addEventListener("click", async () => {
  try { const r=await postJson("/api/hooks/register"); alert(r.message||"Hook registered."); }
  catch(e) { alert("Failed to register hook."); }
});

document.querySelectorAll("[data-chart]").forEach(b => {
  b.addEventListener("click", () => switchChartTab(b.dataset.chart));
});

loadStats();
connectRealtime();
</script>
