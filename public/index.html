<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BBB Admin Dashboard</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #0f766e;
        --accent-2: #155e75;
        --warn: #b91c1c;
        --border: #dbe3ee;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #eef7f6 0%, var(--bg) 35%);
        color: var(--text);
      }

      h1, h2 {
        margin: 0 0 12px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 24px;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .button {
        border: 0;
        background: var(--accent);
        color: white;
        padding: 10px 14px;
        border-radius: 10px;
        cursor: pointer;
      }

      .button.secondary {
        background: var(--accent-2);
      }

      .button.warn {
        background: var(--warn);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
      }

      .label {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 8px;
      }

      .value {
        font-size: 28px;
        font-weight: 700;
      }

      .panels {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .status-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th, td {
        text-align: left;
        padding: 10px 8px;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
        vertical-align: top;
      }

      .mono {
        font-family: Consolas, monospace;
        font-size: 12px;
        word-break: break-all;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 4px 10px;
        background: #d1fae5;
        color: #065f46;
        font-size: 12px;
        font-weight: 600;
      }

      .pill.bad {
        background: #fee2e2;
        color: #991b1b;
      }

      .footer-note {
        margin-top: 8px;
        color: var(--muted);
        font-size: 13px;
      }

      @media (max-width: 980px) {
        .panels {
          grid-template-columns: 1fr;
        }

        .header {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div>
        <h1>BBB Admin Dashboard</h1>
        <div class="label">Thong tin lop hoc, giao vien va hoc sinh tu BBB webhook</div>
      </div>
      <div class="actions">
        <button class="button warn" id="resetButton">Reset Data</button>
      </div>
    </div>

    <div class="grid" id="summaryGrid"></div>

    <div class="panels">
      <div class="card">
        <h2>Lop Hoc</h2>
        <table>
          <thead>
            <tr>
              <th>Class</th>
              <th>Teachers</th>
              <th>Students</th>
              <th>Meetings</th>
              <th>Joins</th>
            </tr>
          </thead>
          <tbody id="classesTable"></tbody>
        </table>
      </div>

      <div class="card">
        <h2>Giao Vien</h2>
        <table>
          <thead>
            <tr>
              <th>Teacher</th>
              <th>Classes</th>
              <th>Students</th>
              <th>Meetings</th>
              <th>Joins</th>
            </tr>
          </thead>
          <tbody id="teachersTable"></tbody>
        </table>
      </div>

      <div class="card">
        <h2>Hoc Sinh</h2>
        <table>
          <thead>
            <tr>
              <th>Student</th>
              <th>ID</th>
              <th>Joins</th>
              <th>Leaves</th>
              <th>Last Meeting</th>
            </tr>
          </thead>
          <tbody id="studentsTable"></tbody>
        </table>
      </div>

      <div class="card">
        <h2>Recent Events</h2>
        <table>
          <thead>
            <tr>
              <th>Event</th>
              <th>Class</th>
              <th>Teacher</th>
              <th>Student</th>
            </tr>
          </thead>
          <tbody id="eventsTable"></tbody>
        </table>
      </div>
    </div>

    <script>
      let eventSource;

      function item(label, value, mono = false) {
        return `
          <div class="card">
            <div class="label">${label}</div>
            <div class="${mono ? "mono" : "value"}">${value ?? "-"}</div>
          </div>
        `;
      }

      function render(data) {
        const summaryItems = [
          ["Tong lop hoc", data.summary.uniqueClasses],
          ["Tong giao vien", data.summary.uniqueTeachers],
          ["Tong hoc sinh", data.summary.uniqueUsers],
          ["Tong meetings", data.summary.uniqueMeetings],
          ["Luot vao lop", data.totals.participantsJoined],
          ["Luot roi lop", data.totals.participantsLeft]
        ];

        document.getElementById("summaryGrid").innerHTML = summaryItems
          .map(([label, value]) => item(label, value))
          .join("");

        document.getElementById("classesTable").innerHTML = data.topClasses
          .map(item => `
            <tr>
              <td>${item.classId || "-"}</td>
              <td>${item.teachers}</td>
              <td>${item.students}</td>
              <td>${item.meetings}</td>
              <td>${item.joinEvents}</td>
            </tr>
          `)
          .join("") || `
            <tr>
              <td colspan="5">Chua co du lieu lop hoc</td>
            </tr>
          `;

        document.getElementById("teachersTable").innerHTML = data.topTeachers
          .map(item => `
            <tr>
              <td>${item.teacherId || "-"}</td>
              <td>${item.classes}</td>
              <td>${item.students}</td>
              <td>${item.meetings}</td>
              <td>${item.joinEvents}</td>
            </tr>
          `)
          .join("") || `
            <tr>
              <td colspan="5">Chua co du lieu giao vien</td>
            </tr>
          `;

        document.getElementById("studentsTable").innerHTML = data.topStudents
          .map(item => `
            <tr>
              <td>${item.userName || "-"}</td>
              <td class="mono">${item.userId || "-"}</td>
              <td>${item.joins}</td>
              <td>${item.leaves}</td>
              <td class="mono">${item.lastMeetingId || "-"}</td>
            </tr>
          `)
          .join("") || `
            <tr>
              <td colspan="5">Chua co du lieu hoc sinh</td>
            </tr>
          `;

        document.getElementById("eventsTable").innerHTML = data.recentEvents
          .slice(0, 12)
          .map(item => `
            <tr>
              <td>${item.eventName}</td>
              <td>${item.classId || "-"}</td>
              <td>${item.teacherId || "-"}</td>
              <td>${item.userName || item.userId || "-"}</td>
            </tr>
          `)
          .join("") || `
            <tr>
              <td colspan="4">Chua co event gan day</td>
            </tr>
          `;
      }

      async function loadStats() {
        const response = await fetch("/api/stats");
        const data = await response.json();
        render(data);
      }

      async function postJson(url, payload) {
        const response = await fetch(url, {
          method: "POST",
          headers: payload ? { "Content-Type": "application/json" } : undefined,
          body: payload ? JSON.stringify(payload) : undefined
        });
        return response.json();
      }

      function connectRealtime() {
        eventSource = new EventSource("/api/stream");
        eventSource.addEventListener("stats", event => {
          render(JSON.parse(event.data));
        });
      }

      document.getElementById("resetButton").addEventListener("click", async () => {
        await postJson("/api/reset");
      });

      loadStats();
      connectRealtime();
    </script>
  </body>
</html>
