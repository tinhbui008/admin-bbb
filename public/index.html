<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nihaoma BBB Dashboard</title>
    <style>
      :root {
        --bg: #fbf4f5;
        --bg-2: #fff7f8;
        --card: rgba(255, 255, 255, 0.96);
        --card-2: #fdf8f9;
        --text: #1b1417;
        --text-2: #6f6266;
        --text-3: #a99ea2;
        --brand: #f1222d;
        --brand-2: #c70d18;
        --brand-soft: #fdecec;
        --border: #f0e4e6;
        --grid: rgba(20, 10, 12, 0.06);
        --emerald: #0f9d6e;
        --emerald-soft: #e6f7f0;
        --indigo: #4f46e5;
        --indigo-soft: #eef0fe;
        --amber: #d97706;
        --amber-soft: #fdf2e3;
        --shadow: 0 24px 60px rgba(32, 16, 20, 0.08);
        --radius-lg: 18px;
        --radius-md: 14px;
        --radius-sm: 10px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(241, 34, 45, 0.11), transparent 24%),
          radial-gradient(circle at 85% 8%, rgba(79, 70, 229, 0.06), transparent 20%),
          linear-gradient(180deg, var(--bg) 0%, #fffdfd 100%);
      }

      button,
      input,
      select {
        font: inherit;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      .page {
        min-height: 100vh;
      }

      .header {
        position: sticky;
        top: 0;
        z-index: 30;
        backdrop-filter: blur(10px) saturate(140%);
        background: rgba(255, 247, 248, 0.88);
        border-bottom: 1px solid var(--border);
      }

      .header-inner,
      .main {
        max-width: 1440px;
        margin: 0 auto;
        padding-left: 28px;
        padding-right: 28px;
      }

      .header-inner {
        padding-top: 14px;
        padding-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: white;
        box-shadow: 0 10px 24px rgba(241, 34, 45, 0.16);
      }

      .brand-mark img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .brand-title {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .brand-title strong {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .brand-pill {
        padding: 3px 7px;
        border-radius: 6px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--brand);
        background: var(--brand-soft);
      }

      .brand-sub {
        margin-top: 2px;
        color: var(--text-3);
        font-size: 12px;
        font-weight: 500;
      }

      .status-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 9px;
        font-size: 12px;
        font-weight: 700;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
      }

      .status-success {
        color: var(--emerald);
        background: var(--emerald-soft);
      }

      .status-success .status-dot {
        background: var(--emerald);
      }

      .status-info {
        color: var(--indigo);
        background: var(--indigo-soft);
      }

      .status-neutral {
        color: var(--text-2);
        background: var(--card);
        border: 1px solid var(--border);
      }

      .header-spacer {
        flex: 1;
      }

      .header-actions {
        display: flex;
        gap: 10px;
      }

      .button,
      .button-muted {
        height: 38px;
        padding: 0 14px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
      }

      .button {
        border: 0;
        color: white;
        background: linear-gradient(150deg, var(--brand), var(--brand-2));
        box-shadow: 0 10px 24px rgba(241, 34, 45, 0.25);
      }

      .button-muted {
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text-2);
      }

      .main {
        padding-top: 26px;
        padding-bottom: 48px;
      }

      .hero-grid,
      .mini-grid {
        display: grid;
        gap: 16px;
      }

      .hero-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .mini-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin-top: 16px;
      }

      .shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 16px;
        align-items: start;
        margin-top: 16px;
      }

      .stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
      }

      .card-pad {
        padding: 18px 20px;
      }

      .metric-orb,
      .metric-card {
        position: relative;
        overflow: hidden;
      }

      .metric-orb::after {
        content: "";
        position: absolute;
        top: -16px;
        right: -16px;
        width: 84px;
        height: 84px;
        border-radius: 50%;
        background: var(--orb, var(--brand-soft));
      }

      .metric-orb .icon {
        position: relative;
        z-index: 1;
        width: 30px;
        height: 30px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        color: var(--icon, var(--brand));
        background: var(--icon-bg, var(--brand-soft));
      }

      .metric-label {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--text-2);
        font-size: 12.5px;
        font-weight: 700;
      }

      .metric-value {
        position: relative;
        z-index: 1;
        margin-top: 12px;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .metric-hint {
        position: relative;
        z-index: 1;
        margin-top: 4px;
        color: var(--text-3);
        font-size: 12px;
        font-weight: 600;
      }

      .metric-card .metric-value {
        margin-top: 7px;
        font-size: 25px;
      }

      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .section-title {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .section-title h2,
      .section-title h3 {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .section-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--emerald);
      }

      .section-note {
        color: var(--text-3);
        font-size: 12px;
        font-weight: 600;
      }

      .live-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .live-room {
        padding: 14px 15px;
        border-radius: 12px;
        border: 1px solid var(--border);
        border-left: 3px solid var(--room-color, var(--brand));
        background: var(--card-2);
      }

      .live-top,
      .row-between {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .live-name {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .live-name strong,
      .ellipsis {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tiny-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 800;
      }

      .tiny-live {
        color: var(--emerald);
        background: var(--emerald-soft);
      }

      .mono {
        font-family: "JetBrains Mono", Consolas, monospace;
      }

      .muted {
        color: var(--text-3);
      }

      .live-sub {
        margin: 5px 0 11px;
        color: var(--text-3);
        font-size: 11px;
      }

      .live-meta {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        color: var(--text-2);
        font-size: 12px;
        font-weight: 700;
      }

      .chips {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 11px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--card-2);
        color: var(--text-2);
        font-size: 12px;
        font-weight: 700;
      }

      .chip.active {
        border-color: transparent;
        color: white;
        background: linear-gradient(150deg, var(--brand), var(--brand-2));
      }

      .tab-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      .tab-button {
        padding: 9px 14px;
        border-radius: 999px;
        border: 1px solid transparent;
        background: var(--card-2);
        color: var(--text-2);
        cursor: pointer;
        font-size: 12.5px;
        font-weight: 800;
      }

      .tab-button.active {
        color: white;
        background: linear-gradient(150deg, var(--brand), var(--brand-2));
      }

      .detail-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .detail-hero {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      .detail-id {
        margin-top: 4px;
        color: var(--text-3);
        font-size: 12px;
      }

      .detail-title {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .detail-icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
      }

      .detail-name {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .summary-stat {
        text-align: center;
      }

      .summary-stat strong {
        display: block;
        font-size: 19px;
        font-weight: 800;
      }

      .summary-stat span {
        color: var(--text-3);
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .detail-box {
        padding: 13px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--card-2);
      }

      .detail-box h3 {
        font-size: 12px;
        font-weight: 800;
        margin-bottom: 11px;
      }

      .list {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }

      .list-item {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .avatar {
        width: 28px;
        height: 28px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 800;
        flex-shrink: 0;
      }

      .list-item strong {
        display: block;
        font-size: 12.5px;
      }

      .list-item span {
        color: var(--text-3);
        font-size: 10.5px;
      }

      .history-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }

      .history-tools {
        display: flex;
        gap: 9px;
        align-items: center;
        flex-wrap: wrap;
      }

      .search {
        height: 36px;
        width: 220px;
        padding: 0 12px;
        border-radius: 9px;
        border: 1px solid var(--border);
        background: var(--card-2);
        color: var(--text);
        outline: none;
      }

      .search:focus,
      .filter-select:focus {
        border-color: var(--brand);
        background: white;
      }

      .filter-select {
        height: 36px;
        min-width: 140px;
        padding: 0 12px;
        border-radius: 9px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text-2);
        outline: none;
      }

      .table-wrap {
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 12px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      th,
      td {
        padding: 11px 14px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
        text-align: left;
      }

      th {
        background: var(--card-2);
        color: var(--text-3);
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      tbody tr:nth-child(even) {
        background: rgba(253, 248, 249, 0.72);
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      .link-button {
        padding: 0;
        border: 0;
        background: none;
        color: var(--text);
        cursor: pointer;
        font-weight: 700;
      }

      .link-button:hover {
        color: var(--brand);
      }

      .sidebar {
        position: sticky;
        top: 84px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .rank-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .rank-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 6px;
        border-radius: 9px;
      }

      .rank-item:hover {
        background: var(--card-2);
      }

      .rank {
        width: 22px;
        text-align: center;
        color: var(--text-3);
        font-size: 12px;
        font-weight: 800;
        flex-shrink: 0;
      }

      .rank-main {
        flex: 1;
        min-width: 0;
      }

      .rank-main strong {
        display: block;
        font-size: 12.5px;
        font-weight: 700;
      }

      .rank-main span {
        display: block;
        color: var(--text-3);
        font-size: 10.5px;
      }

      .rank-value {
        font-size: 13px;
        font-weight: 800;
        flex-shrink: 0;
      }

      .empty {
        padding: 28px;
        text-align: center;
        color: var(--text-3);
        font-size: 13px;
      }

      @media (max-width: 1280px) {
        .hero-grid,
        .mini-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .live-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 1080px) {
        .shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
        }

        .detail-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 720px) {
        .header-inner,
        .main {
          padding-left: 16px;
          padding-right: 16px;
        }

        .header-inner {
          flex-wrap: wrap;
        }

        .header-spacer {
          display: none;
        }

        .hero-grid,
        .mini-grid {
          grid-template-columns: 1fr;
        }

        .history-tools {
          width: 100%;
        }

        .search,
        .filter-select {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="header-inner">
          <div class="brand">
            <div class="brand-mark">
              <img src="/images/logo.png" alt="Nihaoma logo" />
            </div>
            <div>
              <div class="brand-title">
                <strong>Nihaoma</strong>
                <span class="brand-pill">BBB Admin</span>
              </div>
              <div class="brand-sub">Real-time BigBlueButton analytics</div>
            </div>
          </div>

          <div class="status-row" id="statusRow"></div>

          <div class="header-spacer"></div>

          <div class="header-actions">
            <button class="button-muted" id="refreshButton">Refresh</button>
            <button class="button" id="resetButton">Reset Data</button>
          </div>
        </div>
      </header>

      <main class="main">
        <section class="hero-grid" id="heroGrid"></section>
        <section class="mini-grid" id="miniGrid"></section>

        <div class="shell">
          <div class="stack">
            <section class="card card-pad">
              <div class="section-head">
                <div class="section-title">
                  <span class="section-dot"></span>
                  <h2>Live Active Rooms</h2>
                  <span class="tiny-pill tiny-live" id="liveBadge">0 live</span>
                </div>
                <div class="section-note" id="liveSummary">0 participants now</div>
              </div>
              <div class="live-grid" id="liveRooms"></div>
            </section>

            <section class="card card-pad">
              <div class="tab-row" id="detailTabs"></div>
              <div id="detailContent"></div>
            </section>

            <section class="card card-pad">
              <div class="history-head">
                <div class="chips" id="historyTabs"></div>
                <div class="history-tools">
                  <input class="search" id="searchInput" type="search" placeholder="Search..." />
                  <select class="filter-select" id="roomFilter"></select>
                  <select class="filter-select" id="teacherFilter"></select>
                  <select class="filter-select" id="studentFilter"></select>
                </div>
              </div>
              <div class="table-wrap" id="historyTable"></div>
            </section>
          </div>

          <aside class="sidebar">
            <section class="card card-pad">
              <div class="section-title" style="margin-bottom: 13px;">
                <div class="detail-icon" style="width: 26px; height: 26px; border-radius: 8px; background: var(--brand-soft); color: var(--brand);">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M6 9a6 6 0 0 0 12 0V3H6z"></path>
                    <path d="M6 4H3v2a3 3 0 0 0 3 3"></path>
                    <path d="M18 4h3v2a3 3 0 0 1-3 3"></path>
                    <path d="M9 21h6"></path>
                    <path d="M12 17v4"></path>
                  </svg>
                </div>
                <h3>Top Classes</h3>
              </div>
              <div class="rank-list" id="topClasses"></div>
            </section>

            <section class="card card-pad">
              <div class="section-title" style="margin-bottom: 13px;">
                <div class="detail-icon" style="width: 26px; height: 26px; border-radius: 8px; background: var(--amber-soft); color: var(--amber);">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                </div>
                <h3>Top Teachers</h3>
              </div>
              <div class="rank-list" id="topTeachers"></div>
            </section>

            <section class="card card-pad">
              <div class="section-title" style="margin-bottom: 13px;">
                <div class="detail-icon" style="width: 26px; height: 26px; border-radius: 8px; background: var(--emerald-soft); color: var(--emerald);">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                  </svg>
                </div>
                <h3>Top Students</h3>
              </div>
              <div class="rank-list" id="topStudents"></div>
            </section>
          </aside>
        </div>
      </main>
    </div>

    <script>
      let eventSource;

      const state = {
        stats: null,
        activeDetailTab: "class",
        activeHistoryTab: "classes",
        selectedClassId: null,
        selectedTeacherId: null,
        selectedStudentId: null,
        search: "",
        roomFilter: "",
        teacherFilter: "",
        studentFilter: ""
      };

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatNumber(value) {
        return Number(value || 0).toLocaleString("en-US");
      }

      function formatDateTime(value) {
        if (!value) {
          return "-";
        }

        const date = new Date(Number(value) || value);
        if (Number.isNaN(date.getTime())) {
          return "-";
        }

        return date.toLocaleString("en-US");
      }

      function formatDurationFromCreateTime(value) {
        const start = Number(value);
        if (!Number.isFinite(start) || start <= 0) {
          return "-";
        }

        const diffMs = Math.max(0, Date.now() - start);
        const totalSeconds = Math.floor(diffMs / 1000);
        const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, "0");
        const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, "0");
        const seconds = String(totalSeconds % 60).padStart(2, "0");
        return `${hours}:${minutes}:${seconds}`;
      }

      function initialsFromText(value) {
        const text = String(value || "").trim();
        if (!text) {
          return "--";
        }

        const parts = text.split(/\s+/).filter(Boolean);
        const chars = parts.slice(0, 2).map(part => part[0]).join("");
        return chars.toUpperCase();
      }

      function roomColor(index) {
        const palette = [
          ["var(--emerald)", "var(--emerald-soft)"],
          ["var(--indigo)", "var(--indigo-soft)"],
          ["var(--amber)", "var(--amber-soft)"],
          ["var(--brand)", "var(--brand-soft)"]
        ];
        return palette[index % palette.length];
      }

      function getSelectedClass(data) {
        return data.classDetails.find(item => item.classId === state.selectedClassId) || data.classDetails[0] || null;
      }

      function getSelectedTeacher(data) {
        return data.teacherDetails.find(item => item.teacherId === state.selectedTeacherId) || data.teacherDetails[0] || null;
      }

      function getSelectedStudent(data) {
        return data.studentDetails.find(item => item.userId === state.selectedStudentId) || data.studentDetails[0] || null;
      }

      function getClassNameMap(data) {
        const map = new Map();
        (data.classDetails || []).forEach(item => {
          map.set(item.classId, item.className || item.classId);
        });
        return map;
      }

      function getTeacherLabel(data, teacherId) {
        if (!teacherId || teacherId === "unassigned") {
          return "-";
        }
        return teacherId;
      }

      function ensureSelection(data) {
        if (!state.selectedClassId && data.classDetails[0]) {
          state.selectedClassId = data.classDetails[0].classId;
        }
        if (!state.selectedTeacherId && data.teacherDetails[0]) {
          state.selectedTeacherId = data.teacherDetails[0].teacherId;
        }
        if (!state.selectedStudentId && data.studentDetails[0]) {
          state.selectedStudentId = data.studentDetails[0].userId;
        }
      }

      function renderStatusRow(data) {
        const configured = data.hook && data.hook.configured;
        const callbackOk = data.hook && data.hook.callbackUrl === data.hook.expectedCallbackUrl;
        const badges = [

          `<span class="status-badge ${callbackOk ? "status-info" : "status-neutral"}">Webhook ${callbackOk ? "Active" : "Needs Check"}</span>`,
          `<span class="status-badge status-neutral">Live Sync</span>`
        ];
        document.getElementById("statusRow").innerHTML = badges.join("");
      }

      function renderHero(data) {
        const items = [
          { label: "Total Events", value: data.totals.events, hint: `${formatNumber(data.totals.checksumVerified)} verified`, iconBg: "var(--brand-soft)", icon: "var(--brand)", orb: "var(--brand-soft)", svg: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>' },
          { label: "Meetings Created", value: data.totals.meetingsCreated, hint: `${formatNumber(data.summary.uniqueMeetings)} tracked`, iconBg: "var(--indigo-soft)", icon: "var(--indigo)", orb: "var(--indigo-soft)", svg: '<path d="m22 8-6 4 6 4V8Z"></path><rect x="2" y="6" width="14" height="12" rx="2"></rect>' },
          { label: "Participants Joined", value: data.totals.participantsJoined, hint: `${formatNumber(data.summary.uniqueUsers)} unique users`, iconBg: "var(--emerald-soft)", icon: "var(--emerald)", orb: "var(--emerald-soft)", svg: '<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><path d="m10 17 5-5-5-5"></path><path d="M15 12H3"></path>' },
          { label: "Participants Left", value: data.totals.participantsLeft, hint: `${formatNumber(data.totals.meetingsEnded)} meetings ended`, iconBg: "var(--amber-soft)", icon: "var(--amber)", orb: "var(--amber-soft)", svg: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path>' }
        ];

        document.getElementById("heroGrid").innerHTML = items.map(item => `
          <div class="card card-pad metric-orb" style="--icon-bg:${item.iconBg}; --icon:${item.icon}; --orb:${item.orb};">
            <div class="metric-label">
              <span class="icon">

          ["Unique Users", data.summary.uniqueUsers, "var(--emerald)"],
          ["Unique Classes", data.summary.uniqueClasses, "var(--brand)"],
          ["Unique Teachers", data.summary.uniqueTeachers, "var(--amber)"]

        document.getElementById("miniGrid").innerHTML = miniItems.map(([label, value, color]) => `
          <div class="card card-pad metric-card">
            <div class="metric-label" style="color:${color};">
              <span>${escapeHtml(label)}</span>
            </div>
            <div class="metric-value">${formatNumber(value)}</div>
          </div>
        `).join("");

      function renderLiveRooms(data) {
        const liveRooms = data.liveRooms || [];

        document.getElementById("liveBadge").textContent = `${liveRooms.length} live`;
        document.getElementById("liveSummary").textContent = `${formatNumber(totalParticipants)} participants now`;

        const root = document.getElementById("liveRooms");
        if (!liveRooms.length) {
          root.innerHTML = '<div class="empty">No active BBB rooms right now.</div>';
          return;
        }

        root.innerHTML = liveRooms.map((room, index) => {
          const [color, soft] = roomColor(index);

          return `
            <div class="live-room" style="--room-color:${color};">
              <div class="live-top">
                <div class="live-name">
                  <span class="status-dot" style="background:var(--emerald);"></span>
                  <strong class="ellipsis">${escapeHtml(room.meetingName || room.classId || room.meetingId || "Unnamed room")}</strong>
                </div>
                <span class="tiny-pill tiny-live">LIVE</span>

      function renderRankList(targetId, rows, buildRow) {
        const root = document.getElementById(targetId);

      function renderDetailTabs() {

          <div class="detail-box" style="margin-top:14px;">

                    <th>Duration</th>
                  </tr>
                </thead>
                <tbody>
                  ${(selected.participantActivity || []).map(item => `
                    <tr>
                      <td>${escapeHtml(item.name || item.userId || "-")}</td>

                  `).join("") || '<tr><td colspan="12" class="empty">No participant activity yet.</td></tr>'}
                </tbody>
              </table>
            </div>
          </div>
        `;

      function renderTeacherDetail(data) {
        const selected = getSelectedTeacher(data);
        if (!selected) {
          return '<div class="empty">No teacher data yet.</div>';
        }

        state.selectedTeacherId = selected.teacherId;
        return `
          <div class="detail-hero">
            <div class="detail-title">
              <div class="detail-icon" style="background:var(--amber-soft); color:var(--amber);">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                  <circle cx="12" cy="7" r="4"></circle>

              <div class="summary-stat"><strong style="color:var(--amber);">${formatNumber(selected.totals.joinEvents)}</strong><span>Events</span></div>

          </div>

      function renderStudentDetail(data) {
        const selected = getSelectedStudent(data);

          return '<div class="empty">No student data yet.</div>';

        state.selectedStudentId = selected.userId;
        return `
          <div class="detail-hero">
            <div class="detail-title">
              <div class="detail-icon" style="background:var(--emerald-soft); color:var(--emerald);">

                  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                  <circle cx="9" cy="7" r="4"></circle>
                  <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                </svg>
              </div>

                <div class="detail-name">${escapeHtml(selected.userName || selected.userId || "-")}</div>

              <div class="summary-stat"><strong style="color:var(--emerald);">${formatNumber(selected.totals.joins)}</strong><span>Joins</span></div>
              <div class="summary-stat"><strong>${formatNumber(selected.classIds.length)}</strong><span>Classes</span></div>
              <div class="summary-stat"><strong>${formatNumber(selected.teacherIds.length)}</strong><span>Teachers</span></div>

                  <div>

      function renderDetailPanel(data) {
        renderDetailTabs();
        if (state.activeDetailTab === "teacher") {
          document.getElementById("detailContent").innerHTML = renderTeacherDetail(data);
        } else if (state.activeDetailTab === "student") {
          document.getElementById("detailContent").innerHTML = renderStudentDetail(data);
        } else {
          document.getElementById("detailContent").innerHTML = renderClassDetail(data);
        }
      }

      function renderHistoryTabs() {
        const tabs = [
          ["classes", "Classes"],
          ["teachers", "Teachers"],
          ["students", "Students"],
          ["rooms", "Live Rooms"]
        ];
        document.getElementById("historyTabs").innerHTML = tabs.map(([key, label]) => `
          <button class="chip ${state.activeHistoryTab === key ? "active" : ""}" data-history-tab="${key}">${escapeHtml(label)}</button>
        `).join("");
      }

      function updateFilterOptions(data) {
        const classSelect = document.getElementById("roomFilter");
        const teacherSelect = document.getElementById("teacherFilter");
        const studentSelect = document.getElementById("studentFilter");

        const classOptions = ['<option value="">All classes</option>'].concat(
          (data.classDetails || []).map(item => `<option value="${escapeHtml(item.classId)}"${state.roomFilter === item.classId ? " selected" : ""}>${escapeHtml(item.className || item.classId)}</option>`)
        );
        const teacherOptions = ['<option value="">All teachers</option>'].concat(
          (data.teacherDetails || []).map(item => `<option value="${escapeHtml(item.teacherId)}"${state.teacherFilter === item.teacherId ? " selected" : ""}>${escapeHtml(item.teacherId)}</option>`)
        );
        const studentOptions = ['<option value="">All students</option>'].concat(
          (data.studentDetails || []).map(item => `<option value="${escapeHtml(item.userId)}"${state.studentFilter === item.userId ? " selected" : ""}>${escapeHtml(item.userName || item.userId)}</option>`)
        );

        classSelect.innerHTML = classOptions.join("");
        teacherSelect.innerHTML = teacherOptions.join("");
        studentSelect.innerHTML = studentOptions.join("");
      }

      function matchSearch(values) {
        if (!state.search) {
          return true;
        }
        const haystack = values.join(" ").toLowerCase();
        return haystack.includes(state.search);
      }

      function renderHistoryTable(data) {
        renderHistoryTabs();
        updateFilterOptions(data);

        const classNameMap = getClassNameMap(data);
        let columns = [];
        let rows = [];

        if (state.activeHistoryTab === "teachers") {
          columns = ["Teacher", "Classes", "Students", "Meetings", "Join Events", "Leave Events"];
          rows = (data.topTeachers || [])
            .filter(item => (!state.teacherFilter || item.teacherId === state.teacherFilter))
            .filter(item => matchSearch([item.teacherId]))
            .map(item => `
              <tr>
                <td><button class="link-button" data-select-teacher="${escapeHtml(item.teacherId)}">${escapeHtml(item.teacherId || "-")}</button></td>
                <td>${formatNumber(item.classes)}</td>
                <td>${formatNumber(item.students)}</td>
                <td>${formatNumber(item.meetings)}</td>
                <td>${formatNumber(item.joinEvents)}</td>
                <td>${formatNumber(item.leaveEvents)}</td>
              </tr>
            `);
        } else if (state.activeHistoryTab === "students") {
          columns = ["Student", "Student ID", "Classes", "Teachers", "Joins", "Leaves"];
          rows = (data.topStudents || [])
            .filter(item => (!state.studentFilter || item.userId === state.studentFilter))
            .filter(item => matchSearch([item.userName, item.userId]))
            .map(item => `
              <tr>
                <td><button class="link-button" data-select-student="${escapeHtml(item.userId)}">${escapeHtml(item.userName || item.userId || "-")}</button></td>
                <td class="mono">${escapeHtml(item.userId || "-")}</td>
                <td>${formatNumber(item.classes)}</td>
                <td>${formatNumber(item.teachers)}</td>
                <td>${formatNumber(item.joins)}</td>
                <td>${formatNumber(item.leaves)}</td>
              </tr>
            `);
        } else if (state.activeHistoryTab === "rooms") {
          columns = ["Room", "Meeting ID", "Teacher", "Participants", "Moderators", "Duration"];
          rows = (data.liveRooms || [])
            .filter(item => (!state.roomFilter || item.classId === state.roomFilter))
            .filter(item => (!state.teacherFilter || item.teacherId === state.teacherFilter))
            .filter(item => matchSearch([item.meetingName, item.meetingId, item.teacherId]))
            .map(item => `
              <tr>
                <td><button class="link-button" data-select-class="${escapeHtml(item.classId || item.meetingId)}">${escapeHtml(item.meetingName || item.classId || item.meetingId || "-")}</button></td>
                <td class="mono">${escapeHtml(item.meetingId || "-")}</td>
                <td>${escapeHtml(item.teacherId || "-")}</td>
                <td>${formatNumber(item.attendeeCount || 0)}</td>
                <td>${formatNumber(item.moderatorCount || 0)}</td>
                <td>${escapeHtml(formatDurationFromCreateTime(item.createTime))}</td>
              </tr>
            `);
        } else {
          columns = ["Class", "Teacher Count", "Student Count", "Meetings", "Join Events", "Leave Events"];
          rows = (data.topClasses || [])
            .filter(item => (!state.roomFilter || item.classId === state.roomFilter))
            .filter(item => matchSearch([item.className, item.classId]))
            .map(item => `
              <tr>
                <td><button class="link-button" data-select-class="${escapeHtml(item.classId)}">${escapeHtml(item.className || item.classId || "-")}</button></td>
                <td>${formatNumber(item.teachers)}</td>
                <td>${formatNumber(item.students)}</td>
                <td>${formatNumber(item.meetings)}</td>
                <td>${formatNumber(item.joinEvents)}</td>
                <td>${formatNumber(item.leaveEvents)}</td>
              </tr>
            `);
        }

        const header = `<thead><tr>${columns.map(item => `<th>${escapeHtml(item)}</th>`).join("")}</tr></thead>`;
        const body = rows.length ? `<tbody>${rows.join("")}</tbody>` : `<tbody><tr><td colspan="${columns.length}" class="empty">No rows match the current filters.</td></tr></tbody>`;
        document.getElementById("historyTable").innerHTML = `<table>${header}${body}</table>`;
      }

      function bindInteractions() {
        document.querySelectorAll("[data-detail-tab]").forEach(button => {
          button.onclick = () => {
            state.activeDetailTab = button.dataset.detailTab;
            renderCurrentView();
          };
        });

        document.querySelectorAll("[data-history-tab]").forEach(button => {
          button.onclick = () => {
            state.activeHistoryTab = button.dataset.historyTab;
            renderCurrentView();
          };
        });

        document.querySelectorAll("[data-select-class]").forEach(button => {
          button.onclick = () => {
            state.selectedClassId = button.dataset.selectClass;
            state.activeDetailTab = "class";
            renderCurrentView();
          };
        });

        document.querySelectorAll("[data-select-teacher]").forEach(button => {
          button.onclick = () => {
            state.selectedTeacherId = button.dataset.selectTeacher;
            state.activeDetailTab = "teacher";
            renderCurrentView();
          };
        });

        document.querySelectorAll("[data-select-student]").forEach(button => {
          button.onclick = () => {
            state.selectedStudentId = button.dataset.selectStudent;
            state.activeDetailTab = "student";
            renderCurrentView();
          };
        });
      }

      function renderCurrentView() {
        const data = state.stats;
        if (!data) {
          return;
        }

        ensureSelection(data);
        renderStatusRow(data);
        renderHero(data);
        renderLiveRooms(data);
        renderSidebar(data);
        renderDetailPanel(data);
        renderHistoryTable(data);
        bindInteractions();
      }

      async function postJson(url, payload) {
        const response = await fetch(url, {
          method: "POST",
          headers: payload ? { "Content-Type": "application/json" } : undefined,
          body: payload ? JSON.stringify(payload) : undefined
        });
        return response.json();
      }

      async function loadStats() {
        const response = await fetch("/api/stats");
        const data = await response.json();
        state.stats = data;
        renderCurrentView();
      }

      function connectRealtime() {
        eventSource = new EventSource("/api/stream");
        eventSource.addEventListener("stats", event => {
          state.stats = JSON.parse(event.data);
          renderCurrentView();
        });
      }

      document.getElementById("refreshButton").addEventListener("click", () => {
        loadStats();
      });

      document.getElementById("resetButton").addEventListener("click", async () => {
        await postJson("/api/reset");
      });

      document.getElementById("searchInput").addEventListener("input", event => {
        state.search = String(event.target.value || "").trim().toLowerCase();
        renderCurrentView();
      });

      document.getElementById("roomFilter").addEventListener("change", event => {
        state.roomFilter = event.target.value;
        renderCurrentView();
      });

      document.getElementById("teacherFilter").addEventListener("change", event => {
        state.teacherFilter = event.target.value;
        renderCurrentView();
      });

      document.getElementById("studentFilter").addEventListener("change", event => {
        state.studentFilter = event.target.value;
        renderCurrentView();
      });

      loadStats();
      connectRealtime();
    </script>
  </body>
</html>
