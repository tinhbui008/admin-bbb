services:
  postgres:
    image: postgres:16-alpine
    container_name: bbb-admin-nihaoma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bbb_admin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 14a3b3aeb9800c969c8723292e9f3a3ddbd37c59032303c3
    ports:
      - "5432:5432"
    volumes:
      - bbb_admin_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bbb_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  bbb-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bbb-admin-nihaoma
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:14a3b3aeb9800c969c8723292e9f3a3ddbd37c59032303c3@postgres:5432/bbb_admin
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "class.nihaoma-mandarin.com:host-gateway"
    ports:
      - "3000:3000"
    volumes:
      - bbb_admin_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/stats').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  bbb_admin_data:
  bbb_admin_postgres_data:
